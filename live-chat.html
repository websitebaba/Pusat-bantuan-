<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08ad50">
  <title>Live Chat — Prototipe</title>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #f3f5f4;
      color: #202124;
      font-family: Arial, Helvetica, sans-serif;
    }
    .chat-screen {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 480px;
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      background: #fff;
    }
    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      background: #08ad50;
      color: #fff;
      box-shadow: 0 2px 5px rgba(0, 0, 0, .12);
    }
    .emblem {
      display: grid;
      flex: 0 0 42px;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 50%;
      background: #fff;
      color: #08ad50;
    }
    .emblem svg { width: 25px; height: 25px; }
    .header-copy { min-width: 0; }
    .header-copy h1 { margin: 0; font-size: 17px; }
    .header-copy p { margin: 4px 0 0; font-size: 12px; opacity: .95; }
    .category { padding: 12px 16px; background: #f4fbf6; color: #27623d; font-size: 13px; }
    .notice { margin: 12px 16px 4px; padding: 10px 12px; border-radius: 8px; background: #f4fbf6; color: #27623d; font-size: 13px; line-height: 1.5; }
    .chat-space { flex: 1; }
    @media (max-width: 380px) { .chat-header { padding-right: 16px; padding-left: 16px; } }
  </style>
</head>
<body>
  <main class="chat-screen">
    <header class="chat-header">
      <div class="emblem" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 5.75A2.75 2.75 0 0 1 6.75 3h10.5A2.75 2.75 0 0 1 20 5.75v7.5A2.75 2.75 0 0 1 17.25 16H10l-5 4v-4.8a2.74 2.74 0 0 1-1-1.95v-7.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M8 8h8M8 11.5h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="header-copy">
        <h1>Pusat Bantuan</h1>
        <p>Chat bantuan · Demo prototipe</p>
      </div>
    </header>
    <div class="category" id="category"></div>
    <p class="notice">Chat dengan admin akan terbuka otomatis. Jika jendela chat tidak muncul, ketuk ikon chat di pojok kanan bawah.</p>
    <div class="chat-space" aria-hidden="true"></div>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const category = params.get('category') || 'Belum dipilih';
    document.getElementById('category').textContent = 'Kategori: ' + category;
  </script>
  <!--Start of Tawk.to Script-->
  <script type="text/javascript">
    var Tawk_API = Tawk_API || {}, Tawk_LoadStart = new Date();
    Tawk_API.onLoad = function () {
      Tawk_API.maximize();
    };

      var s1 = document.createElement('script'), s0 = document.getElementsByTagName('script')[0];
      s1.async = true;
      s1.src = 'https://embed.tawk.to/6ad2e58da9c1f634c60be96d/default';
      s1.charset = 'UTF-8';
      s1.setAttribute('crossorigin', '*');
      s0.parentNode.insertBefore(s1, s0);
    })();
  </script>
  <!--End of Tawk.to Script-->
</body>
</html>
